# guard-ratchet CI. Copy to .github/workflows/guards.yml (actions are pinned by commit SHA), install the
# project's dependencies and the guard tools at pinned versions, then make the "guards" job a
# required status check on the default branch. See references/trust-model.md.
name: guards

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly full run: new advisories, drift in unchanged code

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
      RUNNER_DIR: tools/guard  # the policy's "runner" setting
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0  # the runner needs the merge-base with the base branch
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      # Project dependencies and pinned guard tools, for example:
      # - run: npm ci
      # - run: pipx install lizard==1.26.1 && pipx install semgrep==1.186.0
      # Tools installed from this change's own lockfile (npx eslint, vitest, plugins) can be swapped by
      # the change. Install the guard tools here at versions written in this file, or from the base
      # branch's pins, e.g. pip install -r <(git show "origin/$BASE_REF:requirements-guards.txt").

      - name: Guards with this change's rules
        run: |
          mode="--full"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then mode=""; fi
          python3 "$RUNNER_DIR/guard.py" check $mode --base "origin/$BASE_REF" \
            --format markdown --output "$GITHUB_STEP_SUMMARY"

      - name: Guards with the base branch's rules (trusted)
        if: github.event_name == 'pull_request'
        run: |
          if ! git cat-file -e "origin/$BASE_REF:$RUNNER_DIR/guard.py" 2>/dev/null; then
            echo "::warning::the base branch has no guards yet; this change introduces them and needs a full human review"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-guard"
          git archive "origin/$BASE_REF" "$RUNNER_DIR" | tar -x -C "$RUNNER_TEMP/base-guard"
          python3 "$RUNNER_TEMP/base-guard/$RUNNER_DIR/guard.py" check --trusted --root . --base "origin/$BASE_REF"
