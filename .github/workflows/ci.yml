name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: node scripts/validate.mjs
      - run: bash -n scripts/link.sh
      - run: python3 skills/guard-ratchet/scripts/ratchet.py conformance
      - name: guard-ratchet JavaScript examples
        working-directory: skills/guard-ratchet/examples/javascript
        run: npm ci && npm test
